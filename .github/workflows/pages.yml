# Publishes the site to GitHub Pages on every push to main. Since 23 November 2026 it is THE site, at
# the root of its own domain, www.athenoa.academy (the domain is set in the repository's Pages
# settings). Until then it was a noindex preview under /athenoa/: to build that again, put back the
# step `node scripts/pages-preview.mjs "/${{ github.event.repository.name }}"` after the build.
name: Site on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The gate (src/components/PreviewGate.astro) is hidden for now (Maria, 21 November 2026); its code
      # stays, and setting this to 'on' brings it back on the preview. The real launch never has it.
      - run: npm run build
        env:
          PUBLIC_PREVIEW_GATE: 'off'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
